name: agent-ci

on:
  push:
    branches: [main]
    paths:
      - "services/agent/**"
      - "deploy/mysql/init/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "services/agent/**"
      - "deploy/mysql/init/**"
      - ".github/workflows/agent-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_DATABASE: billiards_test
          MYSQL_USER: billiards
          MYSQL_PASSWORD: test-billiards-only
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-root-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
        volumes:
          - ${{ github.workspace }}/deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: test-agent-only
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U agent -d agent_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml

      - name: Install dependencies
        working-directory: services/agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare environment file
        working-directory: services/agent
        run: cp .env.example .env

      - name: Run tests
        working-directory: services/agent
        env:
          NO_PROXY: 127.0.0.1,localhost,::1
          no_proxy: 127.0.0.1,localhost,::1
        run: python -m pytest -q
