name: Bug report
description: Report a defect in the agent, knowledge base, API or admin console
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens or real customer data.
        Security issues must be reported privately, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the observed behaviour and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including the shift ID, run ID or query that triggers the issue.
      placeholder: |
        1. Start services/agent with .env.example
        2. POST /v1/reconciliation/runs/stream with shift_id=...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - services/agent
        - services/knowledge-base
        - apps/admin-web
        - apps/api
        - apps/pos-web
        - apps/tablet-web
        - apps/mobile-web
        - apps/realtime-gateway
        - deploy
        - documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or trace output
      description: Paste the failing request, stack trace or run event. Redact secrets.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node/PHP versions and how the datastores are started.
    validations:
      required: true
