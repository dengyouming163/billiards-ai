[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "billiards-agent"
version = "0.1.0"
description = "Billiards AI agent service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "mysql-connector-python>=8.4,<10.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-postgres>=3.2,<4.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "openai>=3.57,<4.0",
    "sqlglot>=30.33,<31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
