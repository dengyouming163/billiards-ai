<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><title>方案B：大图杂志风</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow-y:auto;background:#0f0f16;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.page{padding:0 40px 200px;min-height:1920px}
.header{padding:48px 0 32px;position:sticky;top:0;z-index:100;background:rgba(15,15,22,.92);backdrop-filter:blur(24px)}
.header-title{font-size:56px;font-weight:800;letter-spacing:2px}
.header-sub{font-size:28px;color:#6b7280;margin-top:4px}
.status-bar{display:flex;align-items:center;gap:20px;padding:24px 32px;margin:0 0 28px;background:rgba(201,169,98,.06);border:1px solid rgba(201,169,98,.15);border-radius:24px}
.status-bar .dot{width:12px;height:12px;border-radius:50%;background:#4ade80;flex-shrink:0}
.status-bar .info{flex:1}
.status-bar .info .t{font-size:30px;font-weight:600}
.status-bar .info .s{font-size:24px;color:#6b7280;margin-top:2px}
.status-bar .count{font-size:44px;font-weight:800;color:#c9a962}
.status-bar .arr{font-size:32px;color:#6b7280}
.filter-row{display:flex;gap:16px;margin-bottom:40px;flex-wrap:wrap}
.filter-chip{padding:16px 32px;border-radius:40px;font-size:28px;font-weight:500;background:rgba(26,26,46,.8);color:#9ca3af;border:1px solid rgba(255,255,255,.06);transition:all .2s}
.filter-chip.active{background:rgba(201,169,98,.12);color:#c9a962;border-color:rgba(201,169,98,.3)}

/* B: Single column large cards */
.gallery{display:flex;flex-direction:column;gap:32px}
.card{display:flex;border-radius:32px;overflow:hidden;background:#1a1a2e;border:1px solid rgba(255,255,255,.04);box-shadow:0 8px 32px rgba(0,0,0,.4);height:300px;transition:transform .2s}
.card:active{transform:scale(.98)}
.card-img{width:380px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(135deg,#1a1a2e,#252542)}
.card-img .bg{width:100%;height:100%;object-fit:cover}
.card-img::after{content:'';position:absolute;right:0;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(26,26,46,.9));pointer-events:none}
.online-dot{position:absolute;top:16px;left:16px;width:18px;height:18px;background:#4ade80;border-radius:50%;z-index:3;border:2px solid rgba(0,0,0,.6);box-shadow:0 0 12px rgba(74,222,128,.5)}
.busy-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:2}
.busy-overlay span{font-size:28px;color:#9ca3af;font-weight:500}
.card-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:12px}
.card-name{font-size:44px;font-weight:800}
.level-tag{font-size:24px;color:#c9a962;padding:6px 20px;background:rgba(201,169,98,.12);border-radius:20px;border:1px solid rgba(201,169,98,.2);align-self:flex-start}
.card-price{font-size:56px;font-weight:800;color:#c9a962;text-shadow:0 2px 12px rgba(201,169,98,.3)}
.card-price span{font-size:24px;color:#6b7280;font-weight:400}
.card-stats{display:flex;align-items:center;gap:24px}
.stat{font-size:26px;color:#9ca3af;display:flex;align-items:center;gap:6px}
.book-btn{padding:20px 48px;border-radius:28px;font-size:30px;font-weight:600;background:linear-gradient(135deg,#c9a962,#b8944e);color:#1a1a2e;align-self:flex-start;transition:all .2s}
.book-btn.busy{background:rgba(107,114,128,.2);color:#6b7280}

.tab-placeholder{position:fixed;bottom:0;left:0;right:0;width:1080px;height:140px;background:rgba(15,15,22,.95);border-top:1px solid rgba(201,169,98,.15);display:flex;justify-content:space-around;align-items:center;z-index:1000}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.tab-icon{font-size:40px}
.tab-text{font-size:20px;color:#6b7280}
.tab-text.on{color:#c9a962}
</style></head><body>
<div class="page">
  <div class="header"><div class="header-title">助教 · 专业教练</div><div class="header-sub">一对一指导 · 即约即学</div></div>
  <div class="status-bar"><div class="dot"></div><div class="info"><div class="t">当前助教服务</div><div class="s">1位服务中 · 1位等待确认</div></div><div class="count">2</div><div class="arr">›</div></div>
  <div class="filter-row">
    <div class="filter-chip active">全部</div><div class="filter-chip">可预约</div><div class="filter-chip">特级教练</div><div class="filter-chip">金牌教练</div><div class="filter-chip">高级教练</div><div class="filter-chip">初级教练</div>
  </div>
  <div class="gallery">
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div><div class="online-dot"></div></div><div class="card-body"><div class="card-name">陈志强</div><div class="level-tag">特级教练</div><div class="card-stats"><span class="stat">⭐ 4.9</span><span class="stat">🎁 128</span></div><div class="card-price">¥158<span>/小时</span></div><div class="book-btn">立即预约</div></div></div>
    <div class="card" style="opacity:.75"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e1e2e,#1a1a2e)"></div><div class="busy-overlay"><span>忙碌中</span></div></div><div class="card-body"><div class="card-name">王小明</div><div class="level-tag">金牌教练</div><div class="card-stats"><span class="stat">⭐ 4.7</span><span class="stat">🎁 96</span></div><div class="card-price">¥128<span>/小时</span></div><div class="book-btn busy">忙碌中</div></div></div>
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div><div class="online-dot"></div></div><div class="card-body"><div class="card-name">李明华</div><div class="level-tag">高级教练</div><div class="card-stats"><span class="stat">⭐ 4.5</span><span class="stat">🎁 63</span></div><div class="card-price">¥98<span>/小时</span></div><div class="book-btn">立即预约</div></div></div>
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div><div class="online-dot"></div></div><div class="card-body"><div class="card-name">张伟</div><div class="level-tag">金牌教练</div><div class="card-stats"><span class="stat">⭐ 4.8</span><span class="stat">🎁 201</span></div><div class="card-price">¥128<span>/小时</span></div><div class="book-btn">立即预约</div></div></div>
  </div>
</div>
<div class="tab-placeholder"><div class="tab-item"><span class="tab-icon">🏠</span><span class="tab-text">首页</span></div><div class="tab-item"><span class="tab-icon">🍺</span><span class="tab-text">点单</span></div><div class="tab-item"><span class="tab-icon">🎱</span><span class="tab-text on">助教</span></div><div class="tab-item"><span class="tab-icon">📊</span><span class="tab-text">记分</span></div></div>
</body></html>
