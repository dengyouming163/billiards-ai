.phone .tab{padding:6px 16px;border-radius:16px;font-size:11px;color:#6b7280;background:#f3f4f6;white-space:nowrap}
.phone .tab.on{background:#059669;color:#fff}
.phone .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.03);margin-bottom:10px}
