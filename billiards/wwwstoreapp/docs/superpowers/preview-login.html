<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录页 · 多风格预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#e5e7eb}
.toolbar{position:sticky;top:0;z-index:100;background:#1f2937;color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar button{padding:10px 24px;border-radius:20px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.toolbar button.active{background:#fff;color:#1f2937}
.toolbar button:not(.active){background:rgba(255,255,255,.15);color:#fff}
.toolbar .label{margin-right:auto;font-weight:700}
.preview-wrap{display:flex;justify-content:center;padding:20px}
.phone{width:390px;min-height:844px;border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
</style>
</head>
<body>

<div class="toolbar">
  <span class="label"> Login Page Design</span>
  <button id="btn1" class="active" onclick="switchStyle(1)">A · 极简商务</button>
  <button id="btn2" onclick="switchStyle(2)">B · 渐变运动</button>
  <button id="btn3" onclick="switchStyle(3)">C · 暗金奢华</button>
</div>

<div class="preview-wrap"><div class="phone" id="phone"></div></div>

<script>
const styleA=`
<div style="background:#fff;min-height:844px;display:flex;flex-direction:column">
  <div style="padding:80px 40px 50px;text-align:center">
    <div style="width:72px;height:72px;background:linear-gradient(135deg,#059669,#10b981);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px;box-shadow:0 8px 24px rgba(5,150,105,.3)">8</div>
    <div style="font-size:28px;font-weight:700;color:#1f2937;margin-bottom:6px">台屏智联</div>
    <div style="font-size:14px;color:#9ca3af">球房管理 · 智慧经营</div>
  </div>
  <div style="flex:1;background:#f9fafb;border-radius:36px 36px 0 0;padding:36px 28px">
    <div style="margin-bottom:24px">
      <div style="font-size:13px;color:#9ca3af;margin-bottom:8px;padding-left:4px">手机号</div>
      <div style="display:flex;align-items:center;background:#fff;border-radius:16px;padding:14px 18px;border:2px solid #f3f4f6">
        <span style="font-size:20px;margin-right:12px"> </span>
        <input placeholder="请输入手机号" style="border:none;outline:none;flex:1;font-size:16px;color:#1f2937;background:transparent">
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:13px;color:#9ca3af;margin-bottom:8px;padding-left:4px">密码</div>
      <div style="display:flex;align-items:center;background:#fff;border-radius:16px;padding:14px 18px;border:2px solid #f3f4f6">
        <span style="font-size:20px;margin-right:12px"> </span>
        <input type="password" placeholder="请输入密码" style="border:none;outline:none;flex:1;font-size:16px;color:#1f2937;background:transparent">
      </div>
    </div>
    <div style="text-align:right;margin-bottom:28px"><span style="font-size:13px;color:#059669">忘记密码？</span></div>
    <button style="width:100%;padding:16px;background:#059669;color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:700">登录</button>
    <div style="text-align:center;margin-top:28px;font-size:12px;color:#9ca3af">
      <span>登录即同意 </span><span style="color:#059669">《服务协议》</span><span> 和 </span><span style="color:#059669">《隐私政策》</span>
    </div>
  </div>
</div>`;

const styleB=`
<div style="background:linear-gradient(180deg,#0f1720 0%,#1a2332 40%,#f2f3f5 40%);min-height:844px;display:flex;flex-direction:column">
  <div style="padding:100px 40px 60px;text-align:center">
    <div style="font-size:56px;margin-bottom:12px"> </div>
    <div style="font-size:32px;font-weight:800;color:#fff;margin-bottom:4px">台屏智联</div>
    <div style="font-size:14px;color:rgba(255,255,255,.6);letter-spacing:2px">SMART BILLIARDS</div>
  </div>
  <div style="margin:0 24px;background:#fff;border-radius:28px;padding:40px 28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.15)">
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;background:#f5f7fa;border-radius:14px;padding:16px 18px">
        <span style="font-size:20px"> </span>
        <input placeholder="手机号" style="border:none;outline:none;flex:1;font-size:16px;background:transparent;color:#1f2937">
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;background:#f5f7fa;border-radius:14px;padding:16px 18px">
        <span style="font-size:20px"> </span>
        <input type="password" placeholder="密码" style="border:none;outline:none;flex:1;font-size:16px;background:transparent;color:#1f2937">
      </div>
    </div>
    <div style="text-align:right;margin-bottom:24px"><span style="font-size:13px;color:#6366f1">忘记密码？</span></div>
    <button style="width:100%;padding:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(99,102,241,.3)">登 录</button>
  </div>
  <div style="text-align:center;margin-top:auto;padding:32px;font-size:12px;color:#9ca3af">
    <span>登录即同意 </span><span style="color:#6366f1">《服务协议》</span><span> 和 </span><span style="color:#6366f1">《隐私政策》</span>
  </div>
</div>`;

const styleC=`
<div style="background:#0a0a0a;min-height:844px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px">
  <div style="text-align:center;margin-bottom:48px">
    <div style="width:80px;height:80px;background:linear-gradient(135deg,#d4a853,#b8942d);border-radius:24px;display:inline-flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#0a0a0a;margin-bottom:20px;box-shadow:0 0 40px rgba(212,168,83,.25)">8</div>
    <div style="font-size:28px;font-weight:700;color:#f5f5f5;letter-spacing:4px;margin-bottom:8px">台屏智联</div>
    <div style="width:32px;height:2px;background:linear-gradient(90deg,#d4a853,transparent);margin:0 auto 12px"></div>
    <div style="font-size:13px;color:#666;letter-spacing:2px">PREMIUM BILLIARDS</div>
  </div>
  <div style="width:100%;max-width:340px">
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:16px 18px">
        <span style="font-size:18px;margin-right:12px;opacity:.4"> </span>
        <input placeholder="手机号" style="border:none;outline:none;flex:1;font-size:15px;background:transparent;color:#e5e5e5">
      </div>
    </div>
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:16px 18px">
        <span style="font-size:18px;margin-right:12px;opacity:.4"> </span>
        <input type="password" placeholder="密码" style="border:none;outline:none;flex:1;font-size:15px;background:transparent;color:#e5e5e5">
      </div>
    </div>
    <button style="width:100%;padding:16px;background:linear-gradient(135deg,#d4a853,#b8942d);color:#0a0a0a;border:none;border-radius:12px;font-size:16px;font-weight:700">登 录</button>
    <div style="text-align:center;margin-top:24px;font-size:12px;color:#444">
      <span>登录即同意 </span><span style="color:#d4a853">《服务协议》</span><span style="color:#444"> 和 </span><span style="color:#d4a853">《隐私政策》</span>
    </div>
  </div>
</div>`;

const d=document.getElementById('phone');d.innerHTML=styleA;
function switchStyle(n){
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn'+n).classList.add('active');
  d.innerHTML=[null,styleA,styleB,styleC][n];
}
</script>
</body>
</html>
