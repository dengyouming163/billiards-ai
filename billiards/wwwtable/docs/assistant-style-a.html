<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><title>方案A：2列沉浸画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow-y:auto;background:#0f0f16;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.page{padding:0 40px 200px;min-height:1920px}
.header{padding:48px 0 32px;position:sticky;top:0;z-index:100;background:rgba(15,15,22,.92);backdrop-filter:blur(24px)}
.header-title{font-size:56px;font-weight:800;letter-spacing:2px}
.header-title .gold{color:#c9a962}
.header-sub{font-size:28px;color:#6b7280;margin-top:4px}
.status-bar{display:flex;align-items:center;gap:20px;padding:24px 32px;margin:0 0 28px;background:rgba(201,169,98,.06);border:1px solid rgba(201,169,98,.15);border-radius:24px}
.status-bar .dot{width:12px;height:12px;border-radius:50%;background:#4ade80;flex-shrink:0}
.status-bar .dot.amber{background:#f59e0b}
.status-bar .info{flex:1}
.status-bar .info .t{font-size:30px;font-weight:600}
.status-bar .info .s{font-size:24px;color:#6b7280;margin-top:2px}
.status-bar .count{font-size:44px;font-weight:800;color:#c9a962}
.status-bar .arr{font-size:32px;color:#6b7280}
.filter-row{display:flex;gap:16px;margin-bottom:40px;flex-wrap:wrap}
.filter-chip{padding:16px 32px;border-radius:40px;font-size:28px;font-weight:500;background:rgba(26,26,46,.8);color:#9ca3af;border:1px solid rgba(255,255,255,.06);transition:all .2s}
.filter-chip.active{background:rgba(201,169,98,.12);color:#c9a962;border-color:rgba(201,169,98,.3)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{border-radius:32px;overflow:hidden;background:#1a1a2e;border:1px solid rgba(255,255,255,.04);transition:transform .2s;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card:active{transform:scale(.97)}
.card-img{width:100%;height:420px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1a1a2e,#252542)}
.card-img .bg{width:100%;height:100%;object-fit:cover}
.card-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(0deg,rgba(15,15,22,.9),transparent);pointer-events:none}
.online-dot{position:absolute;top:16px;right:16px;width:18px;height:18px;background:#4ade80;border-radius:50%;z-index:3;border:2px solid rgba(0,0,0,.6);box-shadow:0 0 12px rgba(74,222,128,.5)}
.busy-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:2}
.busy-overlay span{font-size:28px;color:#9ca3af;font-weight:500}
.img-info{position:absolute;bottom:0;left:0;right:0;padding:20px 24px;z-index:3;display:flex;align-items:flex-end;justify-content:space-between}
.card-name{font-size:36px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.level-tag{font-size:22px;color:#c9a962;padding:4px 16px;background:rgba(201,169,98,.15);border-radius:20px;margin-top:4px;display:inline-block}
.card-price{font-size:48px;font-weight:800;color:#c9a962;text-shadow:0 2px 12px rgba(201,169,98,.4)}
.card-price span{font-size:24px;color:#6b7280;font-weight:400}
.card-stats{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 20px}
.book-btn{padding:14px 36px;border-radius:24px;font-size:28px;font-weight:600;background:linear-gradient(135deg,#c9a962,#b8944e);color:#1a1a2e;transition:all .2s}
.book-btn.busy{background:rgba(107,114,128,.2);color:#6b7280}
.tab-placeholder{position:fixed;bottom:0;left:0;right:0;width:1080px;height:140px;background:rgba(15,15,22,.95);border-top:1px solid rgba(201,169,98,.15);display:flex;justify-content:space-around;align-items:center;z-index:1000}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.tab-icon{font-size:40px}
.tab-text{font-size:20px;color:#6b7280}
.tab-text.on{color:#c9a962}
</style></head><body>
<div class="page">
  <div class="header"><div class="header-title">助教<span class="gold">·</span>专业教练</div><div class="header-sub">一对一指导 · 即约即学</div></div>
  <div class="status-bar"><div class="dot"></div><div class="info"><div class="t">当前助教服务</div><div class="s">1位服务中 · 1位等待确认</div></div><div class="count">2</div><div class="arr">›</div></div>
  <div class="filter-row">
    <div class="filter-chip active">全部</div><div class="filter-chip">可预约</div><div class="filter-chip">特级教练</div><div class="filter-chip">金牌教练</div><div class="filter-chip">高级教练</div><div class="filter-chip">初级教练</div>
  </div>
  <div class="gallery">
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div><div class="online-dot"></div><div class="img-info"><div><div class="card-name">陈志强</div><div class="level-tag">特级教练</div></div><div class="card-price">¥158<span>/h</span></div></div></div><div class="card-stats"><span></span><div class="book-btn">立即预约</div></div></div>
    <div class="card" style="opacity:.7"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e1e2e,#1a1a2e)"></div><div class="busy-overlay"><span>忙碌中</span></div><div class="img-info"><div><div class="card-name">王小明</div><div class="level-tag">金牌教练</div></div><div class="card-price">¥128<span>/h</span></div></div></div><div class="card-stats"><span></span><div class="book-btn busy">忙碌中</div></div></div>
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div><div class="online-dot"></div><div class="img-info"><div><div class="card-name">李明华</div><div class="level-tag">高级教练</div></div><div class="card-price">¥98<span>/h</span></div></div></div><div class="card-stats"><span></span><div class="book-btn">立即预约</div></div></div>
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></div><div class="online-dot"></div><div class="img-info"><div><div class="card-name">张伟</div><div class="level-tag">金牌教练</div></div><div class="card-price">¥128<span>/h</span></div></div></div><div class="card-stats"><span></span><div class="book-btn">立即预约</div></div></div>
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#0f172a,#1e293b)"></div><div class="online-dot"></div><div class="img-info"><div><div class="card-name">赵雪</div><div class="level-tag">初级教练</div></div><div class="card-price">¥68<span>/h</span></div></div></div><div class="card-stats"><span></span><div class="book-btn">立即预约</div></div></div>
    <div class="card"><div class="card-img"><div class="bg" style="background:linear-gradient(135deg,#1e2e3e,#0f1a2a)"></div><div class="online-dot"></div><div class="img-info"><div><div class="card-name">刘洋</div><div class="level-tag">高级教练</div></div><div class="card-price">¥98<span>/h</span></div></div></div><div class="card-stats"><span></span><div class="book-btn">立即预约</div></div></div>
  </div>
</div>
<div class="tab-placeholder"><div class="tab-item"><span class="tab-icon">🏠</span><span class="tab-text">首页</span></div><div class="tab-item"><span class="tab-icon">🍺</span><span class="tab-text">点单</span></div><div class="tab-item"><span class="tab-icon">🎱</span><span class="tab-text on">助教</span></div><div class="tab-item"><span class="tab-icon">📊</span><span class="tab-text">记分</span></div></div>
</body></html>
