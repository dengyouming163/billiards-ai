<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案A：极简白底 — 统一弹窗风格</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f8fafc 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 20px; flex-wrap: wrap; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.modal { position: relative; z-index: 50; background: #fff; border-radius: 16px; width: 100%; max-width: 480px; max-height: 85vh; box-shadow: 0 25px 60px rgba(0,0,0,.15), 0 0 0 1px rgba(0,0,0,.04); display: flex; flex-direction: column; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #f1f5f9; }
.modal-header h2 { font-size: 18px; font-weight: 700; color: #0f172a; }
.modal-header button { padding: 6px; border-radius: 8px; border: none; background: transparent; cursor: pointer; transition: background .15s; }
.modal-header button:hover { background: #f1f5f9; }
.modal-header button svg { width: 20px; height: 20px; color: #94a3b8; }
.modal-body { flex: 1; overflow: auto; padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; display: flex; gap: 12px; background: #fafafa; border-radius: 0 0 16px 16px; }
.btn-cancel { flex: 1; padding: 10px 0; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; color: #475569; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; }
.btn-cancel:hover { background: #f1f5f9; border-color: #cbd5e1; }
.btn-primary { flex: 1; padding: 10px 0; border-radius: 12px; border: none; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; box-shadow: 0 2px 8px rgba(16,185,129,.25); }
.btn-primary:hover { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 4px 12px rgba(16,185,129,.35); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
</style>
</head>
<body>
<div class="backdrop"></div>

<div class="modal">
  <div class="modal-header">
    <h2>套餐验券</h2>
    <button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="modal-body">
    <p style="color:#475569;font-size:14px;margin-bottom:16px">选择套餐券</p>
    <div style="border:2px solid #10b981;border-radius:12px;padding:14px;background:#f0fdf4;margin-bottom:12px">
      <p style="font-weight:600;color:#0f172a">2小时畅打券</p>
      <p style="font-size:13px;color:#64748b;margin-top:4px">⏱ 2小时 · ¥58 · <span style="text-decoration:line-through;color:#cbd5e1">¥76</span></p>
    </div>
    <div style="border:2px solid #e2e8f0;border-radius:12px;padding:14px">
      <p style="font-weight:600;color:#0f172a">3小时体验券</p>
      <p style="font-size:13px;color:#64748b;margin-top:4px">⏱ 3小时 · ¥88 · <span style="text-decoration:line-through;color:#cbd5e1">¥118</span></p>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-cancel">取消</button>
    <button class="btn-primary">确认开台 · ¥58</button>
  </div>
</div>

<div class="modal" style="max-width:420px">
  <div class="modal-header">
    <h2>交接班</h2>
    <button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="modal-body">
    <p style="color:#475569;font-size:14px;margin-bottom:12px">当前班次</p>
    <div style="background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:#64748b;font-size:13px">收银员</span><span style="font-weight:600;color:#0f172a;font-size:13px">张三</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:#64748b;font-size:13px">现金收入</span><span style="font-weight:600;color:#10b981;font-size:13px">¥1,280.00</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:#64748b;font-size:13px">开台次数</span><span style="font-weight:600;color:#0f172a;font-size:13px">8</span></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-cancel">取消</button>
    <button class="btn-primary">确认交班</button>
  </div>
</div>
</body>
</html>
