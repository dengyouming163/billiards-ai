appId: com.tpzl88.pos
productName: 台球收银系统
copyright: Copyright © 2026

directories:
  output: release/win7
  buildResources: build

files:
  - dist-electron/**/*
  - .next/**/*
  - public/**/*
  - .env.production
  - package.json
  - next.config.mjs
  - .babelrc
  - "!node_modules/.cache"
  - "!pnpm-lock.yaml"
  - "!yarn.lock"
  - "!next.config.ts"
  - "!next.config.js"
  - "!**/*.map"
  - "!**/LICENSE*"
  - "!**/CHANGELOG*"
  - "!.next/cache/**"
  - "!.next/dev/**"
  - "!node_modules/.pnpm/@swc*/**"
  - "!node_modules/.pnpm/eslint*/**"
  - "!node_modules/.pnpm/typescript*/**"
  - "!**/tsconfig*.json"

extraMetadata:
  main: dist-electron/main.js

# Win7/8/8.1 — Electron 22 is the last version with Win7 support
electronVersion: 22.3.27

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 台球收银系统
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-Win7_8-x64-${version}.${ext}

asar: true
compression: maximum
npmRebuild: false
